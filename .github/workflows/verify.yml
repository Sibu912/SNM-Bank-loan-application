name: Verify (temporary)

on:
  push:
    branches: ['verify/**']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Show test reports
        if: failure()
        run: |
          for f in $(find target/surefire-reports -name '*.txt' 2>/dev/null); do echo "=== $f"; cat "$f"; done
          for f in $(find target/surefire-reports -name '*-output.txt' 2>/dev/null); do echo "=== $f"; tail -150 "$f"; done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, test and build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watch=false
          npm run build
