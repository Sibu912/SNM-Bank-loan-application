name: CI

# Builds and tests the backend and the frontend on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 21, Maven, PostgreSQL)
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL for the tests (same version as on the PC)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snm_app
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: snm_loans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snm_app -d snm_loans_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_PASSWORD: ci-test-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and run tests
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build
        run: npm run build
