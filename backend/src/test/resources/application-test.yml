# Used by tests marked with @ActiveProfiles("test").
# Replaces PostgreSQL with an in-memory H2 database, so tests run anywhere
# (your PC, GitHub Actions) without a real database or a password.
# ${random.uuid} gives every Spring test context its own empty database,
# so data saved by one test class can't affect another.
spring:
  datasource:
    url: jdbc:h2:mem:snm_loans_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
