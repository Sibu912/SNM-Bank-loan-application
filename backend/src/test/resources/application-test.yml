# Used by tests marked with @ActiveProfiles("test").
# Tests run against a real PostgreSQL database called snm_loans_test
# (create it once - see docs/SETUP.md). Flyway creates the tables.
#
# On your PC the defaults below are used, with the password from DB_PASSWORD.
# GitHub Actions starts its own PostgreSQL and sets TEST_DB_PASSWORD.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/snm_loans_test}
    username: ${TEST_DB_USERNAME:snm_app}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD:}}
