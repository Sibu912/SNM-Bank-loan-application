# Serves the admin. Any path that isn't a file (like /login or /applications/SNM-2026-000001)
# gets index.html, so Angular's router can show the right page after a refresh.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
